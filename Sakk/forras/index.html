<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakkverseny Jelentkezés</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <header>
                <h1>Grandmaster Showdown</h1>
                <p class="slogan">"Tedd meg az első lépést a nagymesteri cím felé!"</p>
            </header>

            <form action="#">
                <div class="form-group">
                    <label for="name">Teljes név</label>
                    <input type="text" id="name" name="name" placeholder="Minta János" required>
                </div>

                <div class="form-group">
                    <label for="email">Email cím</label>
                    <input type="email" id="email" name="email" placeholder="pelda@email.com" required>
                </div>

                <div class="form-group">
                    <label for="category">Kategória</label>
                    <select id="category" name="category">
                        <option value="beginner">Kezdő</option>
                        <option value="advanced">Haladó</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="age">Életkor</label>
                    <input type="number" id="age" name="age" placeholder="18" required>
                </div>

                <div class="age-toggle-container">
                    <input type="checkbox" id="under18" class="toggle-checkbox">
                    <label for="under18" class="toggle-label">18 éven aluli versenyző vagyok</label>

                    <div class="guardian-section">
                        <div class="form-group">
                            <label for="gname">Kísérő felnőtt neve</label>
                            <input type="text" id="gname" name="gname">
                        </div>
                        <div class="form-group">
                            <label for="gphone">Kísérő telefonszáma</label>
                            <input type="tel" id="gphone" name="gphone">
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Jelentkezés beküldése</button>
            </form>
        </div>
    </div>
</body>
</html>
